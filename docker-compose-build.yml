name: social-media-monitoring

services:
  # React Frontend
  frontend:
    build:
      context: .
      tags:
        - esanolad/rccgmznl-web-frontend:latest
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.webdev.rccgmountzionnl.org}
    container_name: social-monitoring-frontend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3